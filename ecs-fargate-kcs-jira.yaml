AWSTemplateFormatVersion: "2010-09-09"
Description: Qualys Container Security Jira Integration

########################################
# Parameters
########################################
Parameters:
  IamUserName:
    Type: String
    Description: IAM user allowed to run ECS tasks

  EcrImageUri:
    Type: String
    Description: Full ECR image URI

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  JiraDomain:
    Type: String
    Description: Jira domain (e.g., mydomain.atlassian.net)

  JiraEmail:
    Type: String
    Description: Jira email

  QualysApiGatewayUrl:
    Type: String
    Description: Qualys API URL

  QualysQql:
    Type: String
    Description: Qualys QQL

  QualysTag:
    Type: String
    Description: Tag to assign to images

  JiraApiTokenSecretArn:
    Type: String
    Description: ARN of Jira API token secret

  QualysAccessTokenSecretArn:
    Type: String
    Description: ARN of Qualys access token secret

########################################
# Resources
########################################
Resources:

  ####################################
  # ECS Cluster
  ####################################
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: qualys-kcs-jira-cluster

  ####################################
  # CloudWatch Logs
  ####################################
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/qualys-kcs-jira
      RetentionInDays: 14

  ####################################
  # Execution Role (pull images + secrets)
  ####################################
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRole-qualys-kcs-jira
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AllowSecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref JiraApiTokenSecretArn
                  - !Ref QualysAccessTokenSecretArn

  ####################################
  # Task Role (runtime container AWS API access if needed)
  ####################################
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskRole-qualys-kcs-jira
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref JiraApiTokenSecretArn
                  - !Ref QualysAccessTokenSecretArn

  ####################################
  # Security Group
  ####################################
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate outbound access only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ####################################
  # ECS Task Definition
  ####################################
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: qualys-kcs-jira-tasks
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: python-container
          Image: !Ref EcrImageUri
          Essential: true
          Environment:
            - Name: JIRA_DOMAIN
              Value: !Ref JiraDomain
            - Name: JIRA_EMAIL
              Value: !Ref JiraEmail
            - Name: QUALYS_API_GATEWAY_URL
              Value: !Ref QualysApiGatewayUrl
            - Name: QUALYS_QQL
              Value: !Ref QualysQql
            - Name: QUALYS_TAG
              Value: !Ref QualysTag
          Secrets:
            - Name: JIRA_API_TOKEN
              ValueFrom: !Ref JiraApiTokenSecretArn
            - Name: QUALYS_ACCESS_TOKEN
              ValueFrom: !Ref QualysAccessTokenSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/qualys-kcs-jira
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ####################################
  # IAM Policy: Allow user to run ECS tasks
  ####################################
  EcsRunTaskPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ecs-run-task-policy
      Users:
        - !Ref IamUserName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:DescribeTasks
              - ecs:ListTasks
            Resource: !Ref TaskDefinition
          - Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt ExecutionRole.Arn
              - !GetAtt TaskRole.Arn

########################################
# Outputs
########################################
Outputs:
  ClusterName:
    Value: !Ref ECSCluster

  TaskDefinitionArn:
    Value: !Ref TaskDefinition

  SecurityGroupId:
    Value: !Ref TaskSecurityGroup